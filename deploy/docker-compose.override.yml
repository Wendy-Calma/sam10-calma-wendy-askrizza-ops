# Secrets are injected from the shell environment (SSM), not from files.

services:
  api:
    environment:
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - RAG_API_URL=
    depends_on:
      rag_api:
        condition: service_started
        required: false
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: ./branding/logo.svg
        target: /app/client/dist/assets/logo.svg
        read_only: true

  # Not used: admin panel, and document RAG (needs an OpenAI embeddings key;
  # AskRizza's knowledge comes from S3 via the system prompt instead).
  admin-panel:
    profiles: ["disabled"]
  rag_api:
    profiles: ["disabled"]
  vectordb:
    profiles: ["disabled"]

  caddy:
    image: docker.io/library/caddy:2
    container_name: caddy
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
      - APP_VERSION=${APP_VERSION}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
