<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.5;rx:8}
      .aws{fill:#f1f8f7;stroke:#0f766e;stroke-width:2;stroke-dasharray:6 4}
      .ec2{fill:#e6f2f0;stroke:#0f766e;stroke-width:1.5}
      .ext{fill:#fff7e6;stroke:#b45309;stroke-width:1.5}
      .t{font-weight:bold}
      .s{font-size:11px;fill:#475569}
      .l{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .d{stroke:#64748b;stroke-width:1.3;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
      .n{font-size:11px;fill:#0f172a;font-weight:bold}
    </style>
  </defs>

  <!-- user + DNS -->
  <rect class="box" x="20" y="40" width="130" height="60" rx="8"/>
  <text class="t" x="85" y="66" text-anchor="middle">User (browser)</text>
  <text class="s" x="85" y="84" text-anchor="middle">askrizza.duckdns.org</text>
  <rect class="ext" x="20" y="150" width="130" height="50" rx="8"/>
  <text class="t" x="85" y="172" text-anchor="middle">DuckDNS</text>
  <text class="s" x="85" y="188" text-anchor="middle">name → Elastic IP</text>
  <path class="d" d="M85 100V146"/>

  <!-- AWS region -->
  <rect class="aws" x="190" y="20" width="560" height="560" rx="12"/>
  <text class="t" x="205" y="42" fill="#0f766e">AWS us-east-1 (single region, single AZ)</text>

  <!-- EC2 -->
  <rect class="ec2" x="210" y="60" width="330" height="300" rx="10"/>
  <text class="t" x="225" y="82">EC2 askrizza-prod (c7i-flex.large, Ubuntu 24.04)</text>
  <text class="s" x="225" y="98">SG sam10-web: in 80/443 only · Elastic IP · 30 GB encrypted</text>

  <rect class="box" x="225" y="112" width="140" height="48" rx="6"/>
  <text class="t" x="295" y="132" text-anchor="middle">Caddy</text>
  <text class="s" x="295" y="148" text-anchor="middle">HTTPS (Let's Encrypt)</text>

  <rect class="box" x="385" y="112" width="140" height="48" rx="6"/>
  <text class="t" x="455" y="132" text-anchor="middle">LibreChat (AskRizza)</text>
  <text class="s" x="455" y="148" text-anchor="middle">theme, prompt, model</text>

  <rect class="box" x="385" y="185" width="140" height="44" rx="6"/>
  <text class="t" x="455" y="204" text-anchor="middle">MongoDB</text>
  <text class="s" x="455" y="220" text-anchor="middle">users, chats</text>

  <rect class="box" x="225" y="185" width="140" height="44" rx="6"/>
  <text class="t" x="295" y="204" text-anchor="middle">Meilisearch</text>
  <text class="s" x="295" y="220" text-anchor="middle">chat search</text>

  <rect class="box" x="225" y="250" width="300" height="44" rx="6"/>
  <text class="t" x="375" y="269" text-anchor="middle">cron: backup.sh (hourly)</text>
  <text class="s" x="375" y="285" text-anchor="middle">mongodump → S3</text>

  <rect class="box" x="225" y="305" width="300" height="44" rx="6"/>
  <text class="t" x="375" y="324" text-anchor="middle">CloudWatch agent</text>
  <text class="s" x="375" y="340" text-anchor="middle">memory, disk, log files</text>

  <!-- request path -->
  <path class="l" d="M150 70H218V112"/>
  <text class="n" x="160" y="62">1</text>
  <path class="l" d="M365 136H381"/>
  <text class="n" x="368" y="128">2</text>
  <path class="l" d="M455 160V181"/>

  <!-- external model -->
  <rect class="ext" x="790" y="100" width="150" height="70" rx="8"/>
  <text class="t" x="865" y="125" text-anchor="middle">Google Gemini API</text>
  <text class="s" x="865" y="142" text-anchor="middle">gemini-3.5-flash-lite</text>
  <text class="s" x="865" y="157" text-anchor="middle">(outside AWS, free tier)</text>
  <path class="l" d="M525 128H786"/>
  <text class="n" x="640" y="120">3 question + facts</text>
  <path class="l" d="M786 150H529"/>
  <text class="n" x="640" y="166">4 answer</text>

  <!-- managed services -->
  <rect class="box" x="560" y="200" width="170" height="52" rx="8"/>
  <text class="t" x="645" y="222" text-anchor="middle">SSM Parameter Store</text>
  <text class="s" x="645" y="240" text-anchor="middle">6 SecureString secrets</text>

  <rect class="box" x="560" y="268" width="170" height="60" rx="8"/>
  <text class="t" x="645" y="290" text-anchor="middle">S3 (versioned)</text>
  <text class="s" x="645" y="306" text-anchor="middle">content/knowledge.md</text>
  <text class="s" x="645" y="320" text-anchor="middle">backups/ (14-day lifecycle)</text>

  <path class="d" d="M540 225H556"/>
  <path class="d" d="M525 272H556"/>

  <rect class="box" x="210" y="385" width="250" height="78" rx="8"/>
  <text class="t" x="335" y="407" text-anchor="middle">CloudWatch</text>
  <text class="s" x="335" y="424" text-anchor="middle">Logs: /sam10/caddy, /app, /automation</text>
  <text class="s" x="335" y="439" text-anchor="middle">Metric filters: RequestCount, Error5xx</text>
  <text class="s" x="335" y="454" text-anchor="middle">Dashboard "AskRizza" · 7 alarms</text>
  <path class="d" d="M375 349V381"/>

  <rect class="box" x="490" y="385" width="240" height="78" rx="8"/>
  <text class="t" x="610" y="407" text-anchor="middle">EventBridge → Lambda</text>
  <text class="s" x="610" y="424" text-anchor="middle">wendy-sam10-healthcheck, every 15 min</text>
  <text class="s" x="610" y="439" text-anchor="middle">checks /health + one AI answer</text>
  <text class="s" x="610" y="454" text-anchor="middle">→ HealthCheckOK, AnswerCheckOK metrics</text>
  <path class="d" d="M490 424H464"/>

  <rect class="box" x="210" y="490" width="160" height="56" rx="8"/>
  <text class="t" x="290" y="512" text-anchor="middle">SNS sam10-alerts</text>
  <text class="s" x="290" y="530" text-anchor="middle">email to operator</text>
  <path class="d" d="M290 463V486"/>

  <rect class="box" x="395" y="490" width="160" height="56" rx="8"/>
  <text class="t" x="475" y="512" text-anchor="middle">CloudTrail</text>
  <text class="s" x="475" y="530" text-anchor="middle">sam10-trail (audit)</text>

  <rect class="box" x="575" y="490" width="155" height="56" rx="8"/>
  <text class="t" x="652" y="512" text-anchor="middle">AWS Budgets</text>
  <text class="s" x="652" y="530" text-anchor="middle">monthly alert</text>

  <text class="s" x="790" y="230">Legend</text>
  <line x1="790" y1="248" x2="830" y2="248" class="l"/>
  <text class="s" x="838" y="252">user request path</text>
  <line x1="790" y1="270" x2="830" y2="270" class="d"/>
  <text class="s" x="838" y="274">operations / data</text>
</svg>
